# Static portfolio site (built into /var/www/portfolio by deploy/setup-droplet.sh)
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/portfolio;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html always revalidated, so a new deploy shows up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Photos, fonts and textures change rarely
    location ~* \.(jpg|jpeg|png|webp|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
