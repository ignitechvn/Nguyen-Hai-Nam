<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Nguyễn Hải Nam</title>
    <meta name="description" content="Nguyễn Hải Nam — Computer Science portfolio: robotics, AI, digital inclusion and digitalized sound.">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="vendor.css" />
    <link rel="stylesheet" href="index.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

</head>

<body>
    <div id="cratedigger">
        <div id="cratedigger-canvas"></div>
        <div id="cratedigger-loading">
            <div class="info-container">
                <div class="vertical-center">
                    <span class="loading-disc"></span>
                    <span class="loading-label">Nguyễn Hải Nam</span>
                    <span class="loading-sublabel">Digging through the crate…</span>
                </div>
            </div>
        </div>
        <div id="cratedigger-info">
            <button id="info-close" type="button" aria-label="Close">&times;</button>
            <article id="info-article">
                <div id="cratedigger-record-category"></div>
                <h1 id="cratedigger-record-title"></h1>
                <div id="section-body">
                    <nav id="cratedigger-record-toc"></nav>
                    <div id="section-main">
                        <div id="cratedigger-record-content"></div>
                        <div id="cratedigger-record-contact"></div>
                    </div>
                </div>
            </article>
        </div>
    </div>

    <header id="top-bar" class="noselect">
        <div id="profile">
            <div id="profile-name"></div>
            <div id="profile-meta"></div>
        </div>
        <nav id="category-nav"></nav>
        <button id="lang-toggle" type="button"></button>
        <button id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">&#9776;</button>
    </header>

    <div id="bottom-bar" class="noselect">
        <div class="crate-hint">Scroll, drag or click a record</div>
        <div class="crate-controls">
            <div id="button-prev" class="bottom-bar-item">&lsaquo;&nbsp; Prev</div>
            <div id="button-show" class="bottom-bar-item">Open record</div>
            <div id="button-next" class="bottom-bar-item">Next &nbsp;&rsaquo;</div>
        </div>
    </div>

    <script src="vendor.js"></script>
    <script src="index.js"></script>
</body>

</html>
